<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Chris Price Cloud Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; color: #0e1416; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: #63797d; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 500; color: #33474b; margin-bottom: 0.4rem; }
    input, textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #d3dede;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #0e1416;
      margin-bottom: 1.2rem;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { outline: none; border-color: #0f5c63; }
    textarea { height: 130px; resize: vertical; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #0f5c63;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0a4449; }
    button:disabled { background: #63797d; cursor: not-allowed; }
    #status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    #status.success { background: #deebe4; color: #2f6b4f; display: block; }
    #status.error { background: #fde8e8; color: #b91c1c; display: block; }
    .back { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #63797d; text-decoration: none; }
    .back:hover { color: #0f5c63; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Get in touch</h1>
    <p>Cloud Engineer - AWS SAA-C03 - Open to remote opportunities</p>
    <form id="contactForm">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="Jane Smith" required>
      <label for="email">Your email</label>
      <input type="email" id="email" placeholder="jane@company.com" required>
      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell me about your opportunity..." required></textarea>
      <button type="submit" id="submitBtn">Send message</button>
    </form>
    <div id="status"></div>
    <a href="index.html" class="back">Back to portfolio</a>
  </div>
  <script>
    var API_URL = 'https://m825zz6jd7.execute-api.us-east-1.amazonaws.com/contact';

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();

      var btn = document.getElementById('submitBtn');
      var status = document.getElementById('status');

      btn.disabled = true;
      btn.textContent = 'Sending...';
      status.className = '';
      status.style.display = 'none';

      var data = JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', API_URL, true);
      xhr.setRequestHeader('Content-Type', 'application/json');

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          btn.disabled = false;
          btn.textContent = 'Send message';
          if (xhr.status === 200) {
            status.textContent = 'Message sent! I will get back to you soon.';
            status.className = 'success';
            document.getElementById('contactForm').reset();
          } else {
            status.textContent = 'Something went wrong. Please try again.';
            status.className = 'error';
          }
        }
      };

      xhr.onerror = function() {
        btn.disabled = false;
        btn.textContent = 'Send message';
        status.textContent = 'Message sent! I will get back to you soon.';
        status.className = 'success';
        document.getElementById('contactForm').reset();
      };

      xhr.send(data);
    });
  </script>
</body>
</html>
